# =====================================================================================
#  TOY TEST FIXTURE. NOT TCS. NOT REAL. DO NOT COPY THESE NUMBERS INTO A REAL VALUATION.
# =====================================================================================
# Every number below is made up so the arithmetic can be checked by hand in the tests
# (tests/test_dcf_run.py). The real file, data/manual/dcf_inputs.yaml, is written by the
# author with the finance partner (PROJECT_PLAN.md Phase 0, P0.3). Copy this file's SHAPE,
# not its values.
#
# FORMAT
#   Every assumption is a block with exactly three keys:
#     value:      the number (or a list with one number per forecast year)
#     rationale:  why this value (plain words). Must not be empty.
#     source:     where it comes from (document + page, dataset + date, or "author judgement,
#                 agreed with <name> on <date>"). Must not be empty.
#   The engine REFUSES TO RUN if any rationale or source is missing or blank.
#
#   Rates are DECIMALS: write 0.12 for 12%. A value like 12 is rejected as "looks like a
#   percent".
#
#   Money amounts (base revenue, bridge items) are in `units.money`. The share count is in
#   `units.shares`. Value per share is reported in rupees per share.
#
#   `shared:` holds assumptions common to every scenario. A scenario block may repeat a key to
#   override it for that scenario only (e.g. a higher beta in the bear case).
#
# TIMING (TO VERIFY): cash flows are discounted at year end, in whole years from the
#   valuation date (year 1 = first full forecast year). Mid-year discounting is a common
#   alternative and is not implemented.

ticker: TOY                 # must match the ticker passed to run_dcf
label: "TOY TEST FIXTURE - not TCS, not real"

units:
  money: INR                # one of: INR, INR_MILLION, INR_CRORE
  shares: SHARES            # one of: SHARES, SHARES_MILLION, SHARES_CRORE

shared:
  valuation_date:
    value: "2026-03-31"
    rationale: "Toy: last day of the toy base year."
    source: "Toy test fixture"

  forecast_horizon_years:
    value: 3
    rationale: "Toy: three years keeps hand arithmetic short."
    source: "Toy test fixture"

  base_year_revenue:
    value: 1000
    rationale: "Toy: round number."
    source: "Toy test fixture"

  # ---- operating drivers: one number for every year, or a list with one per year ----
  revenue_growth:
    value: 0.10
    rationale: "Toy: 10% a year so FCFF grows 10% a year."
    source: "Toy test fixture"

  ebit_margin:
    value: 0.20
    rationale: "Toy: operating profit only; other income excluded (PROJECT_PLAN.md 5.1)."
    source: "Toy test fixture"

  tax_rate:
    value: 0.25
    rationale: "Toy: cash tax rate on EBIT."
    source: "Toy test fixture"

  da_pct_revenue:
    value: 0.05
    rationale: "Toy: equal to capex so they cancel."
    source: "Toy test fixture"

  capex_pct_revenue:
    value: 0.05
    rationale: "Toy: equal to D&A so they cancel."
    source: "Toy test fixture"

  nwc_pct_incremental_revenue:
    value: 0.10
    rationale: "Toy: 10 paise of working capital per extra rupee of revenue."
    source: "Toy test fixture"

  # ---- discount rate (WACC) ----
  risk_free_rate:
    value: 0.07
    rationale: "Toy."
    source: "Toy test fixture"

  equity_risk_premium:
    value: 0.05
    rationale: "Toy."
    source: "Toy test fixture"

  beta:
    value: 1.0
    rationale: "Toy: market beta, so cost of equity = 7% + 1.0 x 5% = 12%."
    source: "Toy test fixture"

  debt_weight:
    value: 0.0
    rationale: "Toy: all-equity, so WACC = cost of equity."
    source: "Toy test fixture"

  cost_of_debt_pre_tax:
    value: 0.0
    rationale: "Toy: unused because debt_weight is 0."
    source: "Toy test fixture"

  debt_tax_rate:
    value: 0.25
    rationale: "Toy: tax rate for the interest tax shield; unused because debt_weight is 0."
    source: "Toy test fixture"

  # ---- terminal value ----
  terminal_growth:
    value: 0.04
    rationale: "Toy: below WACC (12%) and below the risk-free rate (7%)."
    source: "Toy test fixture"

  # ---- enterprise value -> equity value bridge (in units.money / units.shares) ----
  cash_and_investments:
    value: 200
    rationale: "Toy."
    source: "Toy test fixture"

  debt:
    value: 50
    rationale: "Toy."
    source: "Toy test fixture"

  lease_liabilities:
    value: 0
    rationale: "Toy: no leases. A real file must state how leases are treated (PROJECT_PLAN.md 5.1)."
    source: "Toy test fixture"

  minority_interest:
    value: 0
    rationale: "Toy: no minorities."
    source: "Toy test fixture"

  diluted_shares:
    value: 10
    rationale: "Toy."
    source: "Toy test fixture"

scenarios:
  base:
    description: "Toy base case: uses every shared assumption as is."

  bear:
    description: "Toy bear case: slower growth in years 2-3, higher beta."
    revenue_growth:
      value: [0.10, 0.05, 0.05]
      rationale: "Toy: one value per forecast year."
      source: "Toy test fixture"
    beta:
      value: 1.2
      rationale: "Toy: cost of equity = 7% + 1.2 x 5% = 13%."
      source: "Toy test fixture"
