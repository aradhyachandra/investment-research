# Company config for TCS. Everything company-specific lives here, not in code.

company:
  ticker_nse: TCS
  ticker_bse: null            # TO VERIFY: not filled in yet
  isin: null                  # TO VERIFY: not filled in yet
  name: Tata Consultancy Services Limited
  fiscal_year_end_month: 3    # balance sheet in AR FY26 is "As at 31 March 2026"
  reporting_currency: INR

# Facts are looked up in this accounting standard unless another is asked for (v1 = Ind AS).
primary_accounting_standard: Ind AS

# Periods are listed explicitly with real dates. Nothing is inferred from labels.
# Quarter-label resolution (e.g. "Q2 FY26") arrives in M2 (periods.py).
periods:
  - label: FY25
    period_type: FY
    fiscal_year: 2025
    start_date: "2024-04-01"
    end_date: "2025-03-31"
  - label: FY26
    period_type: FY
    fiscal_year: 2026
    start_date: "2025-04-01"
    end_date: "2026-03-31"

# Source documents. `file_name` is what the facts CSV puts in `source_doc`.
# local_path = data/raw/<file_name>. sha256 is read from sources_hashes.txt at load time.
#
# period_covered: the period this document is FOR. It is the primary source for facts of
#   exactly that period; when it reprints another period (e.g. last year's comparatives),
#   it is a cross-check, not the primary source.
# Accounting standard, one of:
#   accounting_standard: <std>          the whole document uses one standard
#   accounting_standard_by_page:        PDF page index -> standard; pages not listed have no
#     <std>: [pages]                    known standard and facts cannot cite them
#   Allowed standards: Ind AS, IFRS. Facts are only compared within the same standard.
sources:
  - file_name: tcs_annual_report_FY26.pdf
    doc_type: annual_report
    title: TCS Integrated Annual Report 2025-26
    publisher: Tata Consultancy Services Limited
    url: null
    published_date: null       # TO VERIFY: publication date not recorded (auditor's report is dated 9 April 2026)
    period_covered: FY26
    accounting_standard: Ind AS  # the financial statements in the annual report are Ind AS
    retrieved_on: "2026-10-03" # TO VERIFY: taken from the PDF's file date on disk
    licence_note: null         # TO VERIFY
    # Printed page numbers (the PDF has no embedded page labels). Read by Claude from the page
    # footers; the ingest re-reads footers and reports any disagreement. TO VERIFY (author).
    # PDF 1-3 (cover, founder, contents) and 359-360 (back cover) print no number.
    # PDF 4-33 are two-page spreads: PDF 4 = printed 4 (left half) and 5 (right half).
    page_labels:
      - {pdf_pages: [4, 33], first_printed: 4, per_pdf_page: 2}
      - {pdf_pages: [34, 358], first_printed: 64}
  - file_name: tcs_factsheet_Q1_FY27.pdf
    doc_type: fact_sheet
    title: TCS Financial Results, Quarter I FY 2026-27
    publisher: Tata Consultancy Services Limited
    url: null
    published_date: "2026-07-09" # as printed on the cover
    period_covered: Q1 FY27
    # From the page headings. Highlights/summary pages (4-12, 15, 19, 23) carry no stated
    # standard and are left out on purpose (TO VERIFY which standard they follow).
    accounting_standard_by_page:
      IFRS: [14, 16, 17, 18, 20]   # IFRS income statement, cash flow, financial position (INR and USD)
      Ind AS: [21, 22]             # Ind AS income statement and balance sheet, consolidated
    retrieved_on: "2026-10-03" # TO VERIFY: taken from the PDF's file date on disk
    licence_note: null         # TO VERIFY
    # Slide numbers as printed. Title/divider slides (1, 3, 7, 11, 13) and the last slide (24)
    # print no number. TO VERIFY (author).
    page_labels:
      - {pdf_pages: [2, 2], first_printed: 2}
      - {pdf_pages: [4, 6], first_printed: 4}
      - {pdf_pages: [8, 10], first_printed: 8}
      - {pdf_pages: [12, 12], first_printed: 12}
      - {pdf_pages: [14, 23], first_printed: 14}

# Plausibility bands, in each metric's canonical unit. A value outside its band is
# rejected at load time. Bands are set roughly 2-3x around TCS's actual scale so a
# 10x slip (crore vs million) or a 1000x slip fails, while normal year-to-year
# movement passes.
# TO VERIFY (author): these are provisional engineering guards, not financial
# assumptions. Widen them if a real FY21+ figure falls outside.
plausibility_bands:
  revenue_from_operations: {min: 100000, max: 600000}
  profit_after_tax:        {min: 15000,  max: 150000}
  profit_attributable_to_owners: {min: 15000, max: 150000}
  eps_basic:               {min: 40,     max: 400}
  total_equity:            {min: 40000,  max: 400000}
  cash_and_equivalents:    {min: 1000,   max: 60000}
  # D1 additions. Small or lumpy lines get wider bands; exceptional items and the cash outflows
  # may be 0 in a year (min 0). A negative outflow is rejected separately (metric `sign`).
  other_income:            {min: 1000,   max: 15000}
  finance_costs:           {min: 100,    max: 5000}
  depreciation_amortisation: {min: 2000, max: 15000}
  profit_before_exceptional_items_and_tax: {min: 25000, max: 180000}
  exceptional_restructuring_expenses: {min: 0, max: 15000}
  exceptional_labour_codes_impact:    {min: 0, max: 15000}
  exceptional_legal_claim_provision:  {min: 0, max: 15000}
  profit_before_tax:       {min: 20000,  max: 180000}
  tax_expense:             {min: 5000,   max: 50000}
  total_assets:            {min: 60000,  max: 500000}
  current_investments:     {min: 5000,   max: 100000}
  non_current_investments: {min: 0,      max: 5000}
  other_balances_with_banks: {min: 1000, max: 30000}
  lease_liabilities_current: {min: 300,  max: 6000}
  lease_liabilities_non_current: {min: 2000, max: 30000}
  non_controlling_interests: {min: 200,  max: 5000}
  shares_outstanding:      {min: 150,    max: 800}      # SHARES_CRORE
  cash_from_operations:    {min: 15000,  max: 150000}
  purchase_of_ppe:         {min: 500,    max: 15000}
  purchase_of_intangibles: {min: 0,      max: 5000}

# How finely each reported unit is printed in TCS documents, in that unit. Two figures for the
# same fact (after converting to the canonical unit) "agree" if they differ by no more than
# half of each one's printing step added together.
# TO VERIFY (author): AR FY26 prints INR crore as whole numbers and EPS to 2 decimals; the Q1 FY27
# fact sheet prints INR million as whole numbers. Check any new document against this.
reporting_rounding:
  INR_CRORE: 1
  INR_MILLION: 1
  INR_PER_SHARE: 0.01
  SHARES: 1                 # share counts are printed in full (note 8(m))

# Cross-foot identities checked at load time (D1). For every period, basis and source document
# where the total and ALL parts are in the CSV being loaded: total = sum(sign x part), within
# the printing rounding of all the figures involved (half a step each). If any figure is
# missing, that identity is skipped for that period (not an error).
# Not checked yet (metrics not keyed): assets = equity + liabilities (no liabilities metric);
# opening cash + net change + FX difference = closing cash (no net change / FX metrics).
cross_foot_checks:
  - name: profit_before_tax
    total: profit_before_tax
    parts:
      - {metric: profit_before_exceptional_items_and_tax, sign: 1}
      - {metric: exceptional_restructuring_expenses, sign: -1}
      - {metric: exceptional_labour_codes_impact, sign: -1}
      - {metric: exceptional_legal_claim_provision, sign: -1}
  - name: profit_for_the_year
    total: profit_after_tax
    parts:
      - {metric: profit_before_tax, sign: 1}
      - {metric: tax_expense, sign: -1}

# Refusal pre-check (M6, src/erp/agent/guardrails.py): v1 covers TCS only, so a question naming
# one of these companies is refused as "other_company" before the router runs. A backstop, not a
# complete list: the router refuses other companies too. Whole words, case-insensitive.
# Not listed on purpose: Tata Sons and other Tata group names (TCS's promoter and related parties
# appear in TCS's own filings, e.g. dividends paid to Tata Sons).
guardrails:
  other_company_names:
    - Infosys
    - Infy
    - Wipro
    - HCLTech
    - HCL Technologies
    - HCL Tech
    - Tech Mahindra
    - LTIMindtree
    - LTI Mindtree
    - Mphasis
    - Persistent Systems
    - Coforge
    - Accenture
    - Cognizant
    - Capgemini
    - IBM
